# Default values for AdversaryLab enterprise deployment
replicaCount: 1

image:
  repository: ghcr.io/SriRamKunamsetty/adversarylab
  pullPolicy: IfNotPresent
  tag: "0.1.0"

nameOverride: ""
fullnameOverride: ""

# Existing Kubernetes Secret containing API_KEY and SECRET_KEY
# Pre-create via:
# kubectl create secret generic adversarylab-secrets --from-literal=API_KEY=... --from-literal=SECRET_KEY=...
existingSecret: adversarylab-secrets

# Environment variables configured via ConfigMap
env:
  dataDir: "/data"
  rateLimitPerMin: 120
  cookieSecure: "1"
  trustProxy: "1"
  campaignDeadlineSeconds: 60
  targetTimeoutSeconds: 15
  # Optional OpenAI-compatible upstream target configuration
  # targetUrl: "https://api.openai.com/v1"
  # targetModel: "gpt-4o-mini"

# Persistence configuration for SQLite state
persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # storageClass: "fast-ebs"

service:
  type: ClusterIP
  port: 8081
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100k"
    nginx.ingress.kubernetes.io/limit-rps: "10"
  hosts:
    - host: adversarylab.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: adversarylab-tls
      hosts:
        - adversarylab.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  allowedIngressSources: []
  allowedEgressDestinations: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    additionalLabels:
      release: prometheus-stack

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
