image:
  repository: ghcr.io/SriRamKunamsetty/adversarylab
  tag: "0.1.0"
  pullPolicy: IfNotPresent
# Pre-create: kubectl create secret generic adversarylab-secrets --from-literal=API_KEY=... --from-literal=SECRET_KEY=...
existingSecret: adversarylab-secrets
persistence:
  size: 1Gi
service:
  port: 8081
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
