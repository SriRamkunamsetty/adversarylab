{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adversarylab.fullname" . }}
  labels:
    {{- include "adversarylab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "adversarylab.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      {{- with .Values.networkPolicy.allowedIngressSources }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to external APIs (HTTPS/HTTP) or configured sinks
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
      {{- with .Values.networkPolicy.allowedEgressDestinations }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
