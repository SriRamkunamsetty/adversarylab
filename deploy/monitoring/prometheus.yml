global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus-rules.yaml"

scrape_configs:
  - job_name: "adversarylab"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["adversarylab:8081"]
        labels:
          environment: "production"
          service: "adversarylab"
