name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt bandit
      - name: Lint and format check
        run: ruff check .
      - name: Security SAST with Bandit
        run: bandit -r adversarylab -ll -ii
      - name: Unit, Integration & Security Tests with Coverage
        run: python -m pytest --cov=adversarylab --cov-fail-under=80 --cov-report=term-missing
      - name: Generate CLI SARIF validation
        run: python -m adversarylab --target hardened --goal "test ci" --sarif results.sarif
      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && matrix.python == '3.12'
        with:
          sarif_file: results.sarif
          category: adversarylab-ci-gate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t adversarylab:ci .
      - name: Container Smoke Test
        run: |
          docker run -d --name app -p 8081:8081 -e API_KEY=ci-key -e SECRET_KEY=ci-secret adversarylab:ci
          for i in $(seq 1 20); do curl -fs localhost:8081/healthz && break || sleep 1; done
          curl -fsS localhost:8081/readyz
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adversarylab:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Lint Helm Chart
        run: helm lint deploy/helm/adversarylab
      - name: Dry Run Template Validation
        run: helm template test-release deploy/helm/adversarylab --set existingSecret=dummy-secret
